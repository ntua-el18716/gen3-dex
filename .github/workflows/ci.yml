name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # data-src/ is not cloned here, so tests that need the pret sources are
      # skipped; the validation checks still run against the committed gen3.db.
      - run: npm test

  # The release APK, on pushes only (a full Android build takes a while).
  # Signed with the release key when the repository secrets are set,
  # otherwise with the debug key (see plugins/with-release-signing.js).
  apk:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to the GitHub Release on tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GEN3_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gen3-companion.jks"
            echo "ORG_GRADLE_PROJECT_GEN3_UPLOAD_STORE_FILE=$RUNNER_TEMP/gen3-companion.jks" >> "$GITHUB_ENV"
          fi
      - run: npm run apk
        env:
          ORG_GRADLE_PROJECT_GEN3_UPLOAD_STORE_PASSWORD: ${{ secrets.GEN3_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_GEN3_UPLOAD_KEY_ALIAS: ${{ secrets.GEN3_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_GEN3_UPLOAD_KEY_PASSWORD: ${{ secrets.GEN3_UPLOAD_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: gen3-companion-apk
          path: dist/*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
